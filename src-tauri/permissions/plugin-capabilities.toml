# 插件窗口的应用级（app）ACL 权限定义。
#
# 与 `host-commands.toml` 刻意分成两份。合成一份的后果很具体：插件窗口会跟着宿主窗口
# 一起拿到桌面、Box、工作区那些命令——只要有人往那份清单里加一条命令，就等于同时给
# 插件开了同一条能力。分开之后，两份权限的交集恒为空集，`pnpm verify:acl` 会守住这一点。
#
# 这里列的七条都是「宿主代插件做的事」，插件无法自己完成：
# - 读写文件被限制在插件自己的包目录内（浏览器侧没有文件系统）；
# - 日志按插件分文件落盘；
# - 网络请求由宿主进程发出，不受同源策略约束；
# - 通知交给宿主界面统一展示；
# - 剪贴板读写由宿主进程操作，不受浏览器剪贴板 API 的权限弹窗限制。
#
# 注意本文件只决定「插件窗口能不能调这七条命令」，**不决定某个插件能不能调**。
# capability 是窗口级的，而权限是插件级声明的（plugin.json 的 permissions），两者对不上，
# 所以「这个插件有没有声明 fs:read」由服务层每条命令自己读清单判定，见
# `services/plugin/mod.rs` 的 `require_permission`。

[[permission]]
identifier = "allow-plugin-capabilities"
description = """
允许插件窗口调用宿主开放的七条能力命令。

只授予 plugin_* 窗口。窗口标签同时是插件身份的锚点：能力命令从调用方窗口的标签反推
插件 id，插件自己填的 plugin_id 参数不被采纳，因此插件无法以别人的身份调能力。

授权范围到这里为止——具体某个插件有没有声明某项能力，由服务层读它的 plugin.json 判定。
新增插件能力时要改四处：本清单、前端 `entities/pluginPackage/permissions.ts` 的映射表、
插件页面里的能力桥（bridge.js）、以及 Rust 侧 `domain/plugin/contract.rs` 的权限常量；
`pnpm verify:acl` 与 `pnpm verify:plugins` 会各自守住第一、二处与桥的一致性。
"""
# 文件（限插件自己的包目录内）
commands.allow = [
  "read_plugin_package_file",
  "write_plugin_package_file",
  # 日志
  "write_plugin_log",
  # 网络
  "plugin_http_request",
  # 通知
  "notify_from_plugin",
  # 剪贴板
  "read_plugin_clipboard_text",
  "write_plugin_clipboard_text",
]
