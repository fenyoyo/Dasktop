# 应用级（app）ACL 权限定义。
#
# 这个文件的存在本身就是一道总开关。Tauri 只在「应用定义了 ACL manifest」时，才对**应用
# 自己的命令**做权限检查——见 tauri 的 `webview/mod.rs`：
#
#     if (plugin_command.is_some() || has_app_acl_manifest || !is_local) && … { 拒绝 }
#
# 此前本目录不存在，于是 `has_app_acl_manifest` 为 false，而插件窗口加载的
# `http://plugin.localhost` 又会被 `is_local_url` 判定为**本机来源**（`!is_local` 也为
# false），三个条件一起不成立 → 这道检查被整条跳过。结果是插件页面里的 JS 只要调
# `window.__TAURI_INTERNALS__.invoke("delete_desktop_items", …)` 就能直接执行，
# capabilities 白名单对它毫无约束：白名单管的是 `core:` 这类**插件**命令，
# 管不住应用命令。
#
# 补上本文件后，应用命令一律要经 capability 显式授予才可调用。授予范围见
# `capabilities/default.json`：只有宿主自己的窗口（main / box_* / box_menu /
# drag_preview）拿到，插件窗口刻意不在名单内，因此插件页面调不到任何一条。
#
# 另注：这里定义的是「谁能调命令」，与插件清单里 `permissions` 那套「权限 → 能力」映射
# 目前还没有接上。接上（受控桥）之后，插件窗口会按清单声明逐项授予，判定的落点仍在宿主侧。

[[permission]]
identifier = "allow-host-commands"
description = """
允许宿主窗口调用应用自己注册的全部命令。

只授予 main / box_* / box_menu / drag_preview 四个窗口；插件窗口（plugin_*）刻意不授予，
插件页面因此调不到任何一条命令。新增命令时必须同时加进下面的清单——漏掉的话那条命令在
宿主窗口里也会被拒，症状是「点了没反应 + 控制台报 command not allowed」。
`pnpm verify:acl` 会比对 lib.rs 的 invoke_handler 与本清单，防止漏加。
"""
commands.allow = [
  # box_folder
  "choose_collection_root_folder",
  "create_box_folder",
  "delete_box_folder",
  "handle_box_dragged_paths_to_desktop",
  "handle_box_dropped_paths",
  "migrate_box_folder",
  "open_box_folder",
  # box_window
  "glue_box_window_to_desktop",
  # desktop
  "delete_desktop_items",
  "get_box_folder_revision",
  "get_desktop_snapshot",
  "get_shell_desktop_icon_visible",
  "list_box_folder_items",
  "list_shell_desktop_items",
  "open_desktop_item",
  "paste_desktop_items_from_clipboard",
  "rename_desktop_item",
  "set_shell_desktop_icon_visible",
  "show_native_item_context_menu",
  "write_desktop_items_to_clipboard",
  # native_drop
  "register_box_native_drop_target",
  "unregister_box_native_drop_target",
  # plugin（宿主面板用的三条；下面五条能力命令是留给受控桥的，这里一并授予宿主窗口）
  "list_plugins",
  "notify_from_plugin",
  "open_plugin_root",
  "plugin_asset_base_url",
  "plugin_http_request",
  "read_plugin_package_file",
  "write_plugin_log",
  "write_plugin_package_file",
  # app
  "is_autostart_enabled",
  "is_autostart_launch",
  "is_primary_mouse_button_pressed",
  "set_autostart_enabled",
  # workspace
  "capture_workspace_layout",
  "create_workspace_desktop_shortcut",
  "resolve_current_executable_path",
  "resolve_executable_icons",
  "resolve_startup_workspace_id",
  "restore_workspace_layout",
]
