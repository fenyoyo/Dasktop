<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>二维码工具</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!--
      二维码工具：生成与解析两个标签页。
      生成依赖 qrcode.js（UMD），解析依赖 jsQR.js（UMD）。
      所有宿主能力走 window.dasktop；未注入时禁用相关按钮并给出提示。
    -->
    <header class="toolbar">
      <h1>二维码工具</h1>
      <nav class="tabs">
        <button id="tab-generate" class="tab active" type="button">生成</button>
        <button id="tab-scan" class="tab" type="button">解析</button>
      </nav>
    </header>

    <main class="container">
      <!-- 生成面板 -->
      <section id="panel-generate" class="panel active">
        <label class="field">
          <span>内容</span>
          <textarea
            id="generate-input"
            rows="4"
            placeholder="输入文本、网址或任意字符串"
            spellcheck="false"
          ></textarea>
        </label>

        <div class="row">
          <label class="field compact">
            <span>纠错级别</span>
            <select id="generate-level">
              <option value="L">L（低）</option>
              <option value="M" selected>M（中）</option>
              <option value="Q">Q（较高）</option>
              <option value="H">H（高）</option>
            </select>
          </label>

          <label class="field compact">
            <span>单元格大小</span>
            <input
              id="generate-cell"
              type="number"
              min="2"
              max="20"
              value="6"
            />
          </label>

          <label class="field compact">
            <span>边距</span>
            <input
              id="generate-margin"
              type="number"
              min="0"
              max="10"
              value="2"
            />
          </label>
        </div>

        <div class="actions prominent">
          <button id="generate-btn" class="primary large" type="button">
            ⚡ 生成二维码
          </button>
          <button id="generate-copy-text" type="button">📋 复制内容</button>
        </div>

        <div class="result-area">
          <canvas id="generate-canvas" width="0" height="0"></canvas>
          <div id="generate-placeholder" class="placeholder">
            二维码将显示在这里
          </div>
        </div>

        <div class="actions secondary">
          <button id="generate-copy-image" type="button" disabled>
            🖼️ 复制图片
          </button>
          <button id="generate-save" type="button" disabled>💾 保存图片</button>
        </div>
      </section>

      <!-- 解析面板 -->
      <section id="panel-scan" class="panel">
        <div
          id="scan-drop"
          class="drop-zone"
          tabindex="0"
          role="button"
          aria-label="拖放图片、粘贴或点击选择文件"
        >
          <p>拖放二维码图片到这里</p>
          <p class="muted">或按 Ctrl+V 粘贴 / 点击选择文件</p>
          <!--
            待解析图片就地显示在这个盒子里：未选图时展示上面的两条提示，拿到图片后由
            displayScanImage 给 #scan-drop 加上 has-image，收起提示、换成图片本身。
            这样解析页只有这一个媒体盒子，不必再多一个与之并排的空框。
          -->
          <img id="scan-preview" alt="待解析的二维码" />
        </div>

        <!--
          文件选择框刻意放在拖放框**外面**。
          drop-zone 的点击处理器会调 scanFile.click() 打开文件框，而程序化点击同样会派发
          click 事件并向上冒泡。若这个 input 还留在 #scan-drop 子树里，冒泡就会重新触达拖放
          框的处理器 → 又一次 scanFile.click() → 无限递归直到栈溢出，症状就是「点了没反应、
          文件框弹不出来」。放在框外，冒泡路径上不再有任何处理器，递归无从发生。
        -->
        <input id="scan-file" type="file" accept="image/*" hidden />

        <div class="actions prominent">
          <button id="scan-screenshot" class="primary" type="button">
            📷 截屏识别
          </button>
          <button id="scan-paste" class="primary" type="button">
            📋 从剪贴板粘贴
          </button>
          <button id="scan-select" class="primary" type="button">
            🖼️ 选择图片文件
          </button>
        </div>

        <label class="field">
          <span>解析结果</span>
          <textarea
            id="scan-result"
            rows="4"
            readonly
            placeholder="解析结果会显示在这里"
          ></textarea>
        </label>

        <div class="actions secondary">
          <button id="scan-copy" type="button" disabled>📋 复制结果</button>
          <button id="scan-clear" type="button">🗑️ 清空</button>
        </div>
      </section>
    </main>

    <footer id="status" class="status muted">就绪。</footer>

    <script src="./qrcode.js"></script>
    <script src="./jsQR.js"></script>
    <script type="module" src="./index.js"></script>
  </body>
</html>
