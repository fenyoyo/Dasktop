<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Hello Dasktop</title>
    <style>
      /*
       * 这是一个完全由插件自己掌控的网页：结构、样式、脚本全部在插件包里，
       * 宿主只负责把文件喂给 WebView，不参与任何渲染。
       *
       * 深浅色靠 `prefers-color-scheme` 跟随系统，而不是去问宿主要主题——
       * 插件页面跑在自己的 WebView 里，跨窗口读不到宿主的主题状态。
       */
      :root {
        color-scheme: light dark;
      }

      body {
        margin: 0;
        padding: 24px;
        font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        background: #ffffff;
        color: #0f172a;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 18px;
        font-weight: 600;
      }

      p {
        margin: 0 0 16px;
      }

      .muted {
        color: #6b7280;
      }

      .card {
        border: 1px solid #e7e9ee;
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 12px;
        background: #fbfcfd;
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      code {
        font-family: "Cascadia Mono", Consolas, monospace;
        font-size: 12px;
        background: rgba(127, 127, 127, 0.14);
        border-radius: 4px;
        padding: 1px 5px;
      }

      button {
        font: inherit;
        border: 1px solid #d7dae1;
        border-radius: 6px;
        background: #ffffff;
        color: inherit;
        padding: 6px 12px;
        cursor: pointer;
      }

      button:hover {
        background: #f2f4f8;
      }

      dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 12px;
        margin: 0;
      }

      dt {
        color: #6b7280;
      }

      dd {
        margin: 0;
        word-break: break-all;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #1b1d22;
          color: #e6e8ee;
        }

        .muted,
        dt {
          color: #9aa3b2;
        }

        .card {
          background: #22252c;
          border-color: #31343d;
        }

        button {
          background: #2a2e36;
          border-color: #3a3e48;
        }

        button:hover {
          background: #333843;
        }
      }
    </style>
  </head>
  <body>
    <h1>Hello Dasktop</h1>
    <p class="muted">
      最小的插件示例：<code>plugin.json</code> + <code>index.html</code> + <code>index.js</code>。
      脚本在页面里跑（不是别的地方），所以 DOM、状态、事件都在同一处。
    </p>

    <div class="card">
      <dl>
        <dt>插件 id</dt>
        <dd id="meta-id"></dd>
        <dt>版本</dt>
        <dd id="meta-version"></dd>
        <dt>已授权能力</dt>
        <dd id="meta-permissions"></dd>
      </dl>
    </div>

    <div class="card">
      <p style="margin: 0 0 10px">
        宿主能力挂在 <code>window.dasktop</code> 上，只挂载清单里声明过的部分。
      </p>
      <div class="row">
        <button id="log" type="button">写一条日志</button>
        <button id="notify" type="button">发一条通知</button>
      </div>
      <p class="muted" id="note" style="margin: 12px 0 0"></p>
    </div>

    <script type="module" src="./index.js"></script>
  </body>
</html>
