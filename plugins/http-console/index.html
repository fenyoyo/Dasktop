<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>HTTP 控制台</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        margin: 0;
        padding: 20px;
        font: 13px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        background: #ffffff;
        color: #0f172a;
      }

      h1 {
        margin: 0 0 2px;
        font-size: 16px;
        font-weight: 600;
      }

      .muted {
        color: #6b7280;
      }

      .row {
        display: flex;
        gap: 8px;
        margin: 12px 0;
      }

      input {
        flex: 1;
        min-width: 0;
        font: inherit;
        padding: 7px 10px;
        border: 1px solid #d7dae1;
        border-radius: 6px;
        background: #ffffff;
        color: inherit;
      }

      button {
        font: inherit;
        border: 1px solid #d7dae1;
        border-radius: 6px;
        background: #ffffff;
        color: inherit;
        padding: 7px 12px;
        cursor: pointer;
        white-space: nowrap;
      }

      button:hover {
        background: #f2f4f8;
      }

      button.primary {
        background: #2f6bff;
        border-color: transparent;
        color: #ffffff;
      }

      button.primary:hover {
        background: #2559db;
      }

      button:disabled {
        opacity: 0.55;
        cursor: default;
      }

      .card {
        border: 1px solid #e7e9ee;
        border-radius: 10px;
        padding: 14px;
        margin-bottom: 12px;
        background: #fbfcfd;
      }

      .card h2 {
        margin: 0 0 10px;
        font-size: 13px;
        font-weight: 600;
      }

      dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 12px;
        margin: 0 0 10px;
      }

      dt {
        color: #6b7280;
      }

      dd {
        margin: 0;
        word-break: break-all;
      }

      pre {
        margin: 0;
        padding: 10px;
        max-height: 190px;
        overflow: auto;
        font-family: "Cascadia Mono", Consolas, monospace;
        font-size: 12px;
        line-height: 1.5;
        background: rgba(127, 127, 127, 0.1);
        border-radius: 6px;
        white-space: pre-wrap;
        word-break: break-all;
      }

      a {
        color: #2f6bff;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #1b1d22;
          color: #e6e8ee;
        }

        .muted,
        dt {
          color: #9aa3b2;
        }

        .card {
          background: #22252c;
          border-color: #31343d;
        }

        input,
        button {
          background: #2a2e36;
          border-color: #3a3e48;
        }

        button:hover {
          background: #333843;
        }

        button.primary {
          background: #2f6bff;
        }
      }
    </style>
  </head>
  <body>
    <h1>HTTP 控制台</h1>
    <p class="muted" style="margin: 0 0 4px">
      请求由宿主进程发出（<code>dasktop.net.request</code>），不受同源策略约束。
      <a href="./history.html">查看历史 →</a>
    </p>

    <div class="row">
      <input id="url" type="text" placeholder="https://" spellcheck="false" />
      <button id="send" class="primary" type="button">发送</button>
    </div>

    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <h2 style="margin:0">最近一次结果</h2>
        <button id="copy" type="button" style="display:none">复制响应</button>
      </div>
      <div id="result"><span class="muted">尚未发送请求。</span></div>
    </div>

    <script type="module" src="./index.js"></script>
  </body>
</html>
