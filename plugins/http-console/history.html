<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>请求历史</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        margin: 0;
        padding: 20px;
        font: 13px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        background: #ffffff;
        color: #0f172a;
      }

      h1 {
        margin: 0 0 2px;
        font-size: 16px;
        font-weight: 600;
      }

      .muted {
        color: #6b7280;
      }

      ul {
        margin: 14px 0;
        padding: 0;
        list-style: none;
      }

      li {
        display: flex;
        gap: 10px;
        padding: 8px 10px;
        border: 1px solid #e7e9ee;
        border-radius: 8px;
        margin-bottom: 6px;
        background: #fbfcfd;
      }

      .status {
        flex-shrink: 0;
        min-width: 36px;
        font-family: "Cascadia Mono", Consolas, monospace;
        color: #6b7280;
      }

      .target {
        word-break: break-all;
      }

      .at {
        margin-left: auto;
        flex-shrink: 0;
        color: #6b7280;
        font-size: 12px;
      }

      button {
        font: inherit;
        border: 1px solid #d7dae1;
        border-radius: 6px;
        background: #ffffff;
        color: inherit;
        padding: 6px 12px;
        cursor: pointer;
      }

      button:hover {
        background: #f2f4f8;
      }

      a {
        color: #2f6bff;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #1b1d22;
          color: #e6e8ee;
        }

        .muted,
        .status,
        .at {
          color: #9aa3b2;
        }

        li {
          background: #22252c;
          border-color: #31343d;
        }

        button {
          background: #2a2e36;
          border-color: #3a3e48;
        }

        button:hover {
          background: #333843;
        }
      }
    </style>
  </head>
  <body>
    <h1>请求历史</h1>
    <p class="muted" style="margin: 0 0 12px">
      <a href="./index.html">← 返回控制台</a>
    </p>

    <ul id="list"></ul>

    <button id="clear" type="button">清空历史</button>

    <script type="module" src="./history.js"></script>
  </body>
</html>
